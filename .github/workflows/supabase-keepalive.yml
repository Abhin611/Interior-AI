name: Supabase keep-alive

# Free Supabase projects pause after about 7 days without activity.
# This reads one row twice a week so the project stays active.
on:
  schedule:
    - cron: "0 4 * * 1,4"   # Mondays and Thursdays, 04:00 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one product from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/products?select=product_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase answered HTTP $code"
          test "$code" = "200"
